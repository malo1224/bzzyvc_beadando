<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript CRUD - Formula1</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        nav { margin-bottom: 20px; }
        nav a { text-decoration: none; padding: 10px; background-color: #0056b3; color: white; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #0056b3; color: white; }
        .form-container-div { display: flex; gap: 20px; }
        .form-container { background: white; padding: 15px; border-radius: 5px; width: 300px; margin-bottom: 20px; }
        .form-container input { width: 90%; padding: 8px; margin: 5px 0; }
        button { padding: 8px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        .btn-delete { background-color: #dc3545; }
        .btn-edit { background-color: #ffc107; color: black; }
    </style>
</head>
<body>

    <nav>
        <a href="/">← Vissza a Főoldalra</a>
    </nav>

    <h2>Versenypályák nyílvántartása (AXIOS CRUD)</h2>

    <div class="form-container-div">
        <div class="form-container">
            <h3 id="createTitle">Új pálya hozzáadása</h3>
            <input type="hidden" id="id">
            <input type="text" id="datum" placeholder="Verseny dátuma" required>
            <input type="text" id="nev" placeholder="Pálya neve" required>
            <input type="text" id="helyszin" placeholder="Pálya helyszine">
            <button onclick="create()">Mentés</button>
            <button onclick="resetForm()" style="background-color: #6c757d;">Mégsem</button>
        </div>
    
        <div class="form-container">
            <h3 id="updateTitle">pálya módosítása</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editDatum" placeholder="Verseny dátuma" required>
            <input type="text" id="editNev" placeholder="Pálya neve" required>
            <input type="text" id="editHelyszin" placeholder="Pálya helyszine">
            <button onclick="update()">Mentés</button>
            <button onclick="resetForm('edit')" style="background-color: #6c757d;">Mégsem</button>
        </div>
    </div>

    <table>
        <thead> 
            <tr>
                <th>Verseny Dátum</th>
                <th>Pályan név</th>
                <th>Pálya helyszíne</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script src="/lib/axios.min.js" type="text/javascript"></script>
    <script src="axios.js"></script>

</body>
</html>
